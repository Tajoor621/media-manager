<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111111"><title>Media Manager · File Workbench</title><style>
:root{font-family:system-ui,sans-serif;color-scheme:dark;background:#101010;color:#eee}*{box-sizing:border-box}body{margin:0;padding:20px;max-width:1100px;margin:auto}h1{color:#d7b46b}button,input,textarea{font:inherit}button,.pick{display:inline-block;border:1px solid #b49455;background:#24211b;color:#f4deb0;padding:10px 14px;border-radius:10px;cursor:pointer;margin:4px}button:disabled{opacity:.4}input[type=file]{max-width:100%}.panel{background:#1b1b1b;border:1px solid #38322a;border-radius:14px;padding:16px;margin:16px 0}.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}.item{width:100%;text-align:left;overflow-wrap:anywhere}.muted{color:#aaa}img,video{max-width:100%;max-height:65vh}audio{width:100%}iframe{width:100%;height:65vh;border:0}textarea{width:100%;min-height:240px;background:#0d0d0d;color:white;padding:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere}a{color:#e6c17a}</style></head><body>
<a href="/media-manager/">← Media Manager</a><h1>File Workbench</h1><p class="muted">Local-first preview and file tools. Files remain on your device unless you choose to share them.</p>
<section class="panel"><input id="pick" type="file" multiple><button id="folder">Open folder</button><button id="clear">Clear</button><p id="status" aria-live="polite">Select files to begin.</p><input id="search" placeholder="Search selected files" aria-label="Search files"><div id="files" class="files"></div></section>
<section class="panel"><h2 id="filename">Preview</h2><div id="actions"></div><div id="preview">Select a file above.</div></section>
<script>
const pick=document.querySelector('#pick'),folder=document.querySelector('#folder'),list=document.querySelector('#files'),status=document.querySelector('#status'),preview=document.querySelector('#preview'),actions=document.querySelector('#actions'),filename=document.querySelector('#filename');let entries=[],activeUrl=null;
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const human=n=>n<1024?n+' B':(n/1048576>=1?(n/1048576).toFixed(1)+' MB':(n/1024).toFixed(1)+' KB');
function render(){let q=document.querySelector('#search').value.toLowerCase();list.replaceChildren();entries.filter(f=>f.name.toLowerCase().includes(q)).forEach(f=>{let b=document.createElement('button');b.className='item';b.textContent=f.name+' · '+human(f.size);b.onclick=()=>show(f);list.append(b)});status.textContent=entries.length+' files selected · '+entries.reduce((s,f)=>s+f.size,0).toLocaleString()+' bytes';}
pick.onchange=()=>{entries=[...pick.files];render()};document.querySelector('#search').oninput=render;
folder.onclick=async()=>{if(!window.showDirectoryPicker){status.textContent='Folder picker unavailable in this browser. Select files instead.';return}try{const dir=await showDirectoryPicker();entries=[];for await(const handle of dir.values())if(handle.kind==='file')entries.push(await handle.getFile());render()}catch(e){if(e.name!=='AbortError')status.textContent=e.message}};
document.querySelector('#clear').onclick=()=>{entries=[];pick.value='';reset();render()};
function reset(){if(activeUrl)URL.revokeObjectURL(activeUrl);activeUrl=null;preview.replaceChildren();actions.replaceChildren();filename.textContent='Preview'}
function action(label,fn){let b=document.createElement('button');b.textContent=label;b.onclick=fn;actions.append(b)}
async function show(file){reset();filename.textContent=file.name;activeUrl=URL.createObjectURL(file);action('Download',()=>{const a=document.createElement('a');a.href=activeUrl;a.download=file.name;a.click()});if(navigator.share&&navigator.canShare?.({files:[file]}))action('Share',()=>navigator.share({files:[file]}).catch(()=>{}));let ext=file.name.split('.').pop().toLowerCase();let node;
if(file.type.startsWith('image/')){node=document.createElement('img');node.src=activeUrl;node.alt=file.name;action('Rotate 90°',()=>{const old=Number(node.dataset.angle||0);node.dataset.angle=(old+90)%360;node.style.transform='rotate('+node.dataset.angle+'deg)'})}
else if(file.type.startsWith('video/')){node=document.createElement('video');node.src=activeUrl;node.controls=true;node.playsInline=true}
else if(file.type.startsWith('audio/')){node=document.createElement('audio');node.src=activeUrl;node.controls=true}
else if(file.type==='application/pdf'||ext==='pdf'){node=document.createElement('iframe');node.src=activeUrl;node.title='PDF preview'}
else if(file.type.startsWith('text/')||['txt','md','json','js','ts','tsx','jsx','css','html','xml','csv','log','yaml','yml'].includes(ext)){node=document.createElement('textarea');node.value=await file.text();action('Save edited copy',()=>{let blob=new Blob([node.value],{type:file.type||'text/plain'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)})}
else{node=document.createElement('pre');let bytes=new Uint8Array(await file.slice(0,4096).arrayBuffer());node.textContent=Array.from({length:Math.ceil(bytes.length/16)},(_,i)=>{let chunk=bytes.slice(i*16,i*16+16);return (i*16).toString(16).padStart(8,'0')+'  '+Array.from(chunk,b=>b.toString(16).padStart(2,'0')).join(' ').padEnd(47)+'  '+Array.from(chunk,b=>b>=32&&b<127?String.fromCharCode(b):'.').join('')}).join('\n');if(file.size>4096)node.textContent+='\n… showing first 4096 bytes'}
preview.append(node)}
</script></body></html>
