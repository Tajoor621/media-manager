name: MediaManager621
options:
  bundleIdPrefix: com.tajoor621
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: "Media Manager 621"
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Select photos and videos to import into your private Media Manager library."
    INFOPLIST_KEY_NSFaceIDUsageDescription: "Unlock your private Media Manager library using Face ID."
    INFOPLIST_KEY_UIFileSharingEnabled: YES
    INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
    CODE_SIGN_STYLE: Automatic
targets:
  MediaManager621:
    type: application
    platform: iOS
    sources:
      - path: MediaManager621
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tajoor621.mediamanager
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
