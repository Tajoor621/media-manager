name: Native iOS simulator build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ios-native/**"
      - "public/brand/media-manager-user-icon.webp"
      - "scripts/generate-ios-icon.py"
      - ".github/workflows/ios-native.yml"
  pull_request:
    paths:
      - "ios-native/**"
      - ".github/workflows/ios-native.yml"
permissions:
  contents: read
concurrency:
  group: ios-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Generate branded iOS app icon
        run: |
          python3 -m pip install --disable-pip-version-check Pillow
          python3 scripts/generate-ios-icon.py
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios-native
        run: xcodegen generate
      - name: Compile for iPhone simulator (unsigned)
        working-directory: ios-native
        run: |
          xcodebuild -project MediaManager621.xcodeproj \
            -scheme MediaManager621 \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
