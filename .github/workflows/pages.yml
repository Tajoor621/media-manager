name: Build and publish Media Manager to gh-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: media-manager-gh-pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build GitHub Pages static site
        run: npm run build:pages
        env:
          GITHUB_PAGES: "1"
          BASE_PATH: /media-manager/
      - name: Capture genuine PWA install screenshots
        run: node scripts/capture-pwa-screenshots.mjs
        env:
          BASE_PATH: /media-manager/
      - name: Validate PWABuilder manifest and asset dimensions
        run: node scripts/check-pwa-manifest.mjs
      - name: Publish dist to configured gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          force_orphan: false
          keep_files: false
      - name: Save first-run screenshots to source for Vercel builds
        run: |
          mkdir -p public/screenshots
          for file in media-manager-desktop.png media-manager-mobile.png; do
            if [ ! -f "public/screenshots/$file" ]; then
              cp "dist/screenshots/$file" "public/screenshots/$file"
            fi
          done
          if [ -n "$(git status --porcelain -- public/screenshots)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/screenshots
            git commit -m "chore(pwa): add real install screenshots"
            git push origin HEAD:main
          fi
